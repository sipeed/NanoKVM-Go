[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
@@GROUP@@{{ group | striptags | trim }}
{% for commit in commits %}\
@@ITEM@@{% if commit.breaking %}[breaking] {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\\n") | first | upper_first }}
{% endfor %}\
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^release:", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^build", group = "<!-- 4 -->Build and packaging" },
    { message = "^ci", group = "<!-- 4 -->Build and packaging" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^test", group = "<!-- 6 -->Tests" },
    { message = "^style", group = "<!-- 7 -->Maintenance" },
    { message = "^chore", group = "<!-- 7 -->Maintenance" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", group = "<!-- 9 -->Other changes" },
]
